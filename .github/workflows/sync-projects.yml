name: Sync Projects from Database

on:
  repository_dispatch:
    types: [update-projects]
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || github.token }}

      - name: Setup Submodules
        run: |
          set -x
          if [ -z "${{ secrets.PAT_TOKEN }}" ]; then
            echo "::error::PAT_TOKEN secret is missing! Please add it to GitHub Secrets."
            exit 1
          fi
          git submodule sync
          git config --global url."https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/".insteadOf "https://github.com/"
          # Explicitly set the URL to ensure it uses the new repository name
          git config submodule.projects.url "https://github.com/UlucKaymak/Portfolio-projectDatabase.git"
          git submodule update --init --recursive projects
          
      - name: Update Submodule
        run: |
          git submodule update --remote --merge projects
          
      - name: Sync projects.json
        run: |
          if [ -f "projects/projects.json" ]; then
            cp projects/projects.json projects.json
            echo "projects.json synchronized."
          else
            echo "projects/projects.json not found!"
            exit 1
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add projects projects.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: sync projects from database"
            git push
          fi
