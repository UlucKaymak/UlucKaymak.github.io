<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>JSON Creator</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
    label { display: block; margin-top: 1rem; }
    input, textarea { width: 100%; padding: 6px; margin-top: 4px; }
    button { margin-top: 1.5rem; padding: 10px 20px; }
    #output { margin-top: 2rem; white-space: pre-wrap; background: #f0f0f0; padding: 1rem; }
  </style>
</head>
<body>

  <h1>JSON Doldurucu</h1>

  <form id="jsonForm">
    <label>ID: <input type="text" name="id"></label>
    <label>Title: <input type="text" name="title"></label>
    <label>Type: <input type="text" name="type"></label>
    <label>Date: <input type="text" name="date"></label>
    <label>Description: <textarea name="description"></textarea></label>
    <label>Role: <input type="text" name="role"></label>
    <label>Thumbnail (URL): <input type="text" name="thumbnail"></label>
    <label>Media (virgülle ayır): <input type="text" name="media"></label>
    <label>Tags (virgülle ayır): <input type="text" name="tags"></label>

    <label>Enabled:
      <select name="enabled">
        <option value="true">true</option>
        <option value="false">false</option>
      </select>
    </label>

    <button type="submit">JSON Oluştur</button>
  </form>

  <div id="output"></div>

  <script>
    document.getElementById('jsonForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const formData = new FormData(e.target);

      const json = {
        id: formData.get('id'),
        title: formData.get('title'),
        type: formData.get('type'),
        date: formData.get('date'),
        description: formData.get('description'),
        role: formData.get('role'),
        thumbnail: formData.get('thumbnail'),
        media: formData.get('media').split(',').map(s => s.trim()).filter(Boolean),
        tags: formData.get('tags').split(',').map(s => s.trim()).filter(Boolean),
        enabled: formData.get('enabled') === 'true'
      };

      document.getElementById('output').textContent = JSON.stringify(json, null, 2);
      console.log(json);
    });
  </script>

</body>
</html>
