<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Düzenleyici</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #fff;
            padding: 20px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #4a4a4a;
        }

        .project-card {
            border: 1px solid #ddd;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 6px;
            background-color: #fafafa;
        }

        .project-card h2 {
            margin-top: 0;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            color: #555;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input[type="text"],
        .form-group textarea {
            width: 98%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .form-group input[type="checkbox"] {
            margin-right: 8px;
        }

        .form-group input[type="text"].small-input {
            width: calc(50% - 5px);
            display: inline-block;
        }

        .form-group .media-list,
        .form-group .tags-list {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .form-group .media-list span,
        .form-group .tags-list span {
            background-color: #e2e2e2;
            padding: 5px 10px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .form-group .remove-btn {
            cursor: pointer;
            color: #888;
            font-weight: bold;
            font-size: 14px;
        }

        .add-btn {
            margin-top: 5px;
            padding: 5px 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .save-btn-container {
            text-align: center;
            margin-top: 20px;
        }

        .save-btn {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .save-btn:hover {
            background-color: #0056b3;
        }

        .accordion-item {
            border: 1px solid #ddd;
            margin-bottom: 10px;
            border-radius: 8px;
            overflow: hidden;
        }

        .accordion-header {
            background-color: #f0f0f0;
            padding: 15px 20px;
            cursor: pointer;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease;
        }

        .accordion-header:hover {
            background-color: #e0e0e0;
        }

        .accordion-header .arrow {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .accordion-content {
            padding: 20px;
            display: none;
            background-color: #fff;
        }

        .accordion-item.active .accordion-content {
            display: block;
        }

        .accordion-item.active .accordion-header {
            background-color: #e9e9e9;
        }

        .accordion-item.active .arrow {
            transform: rotate(90deg);
        }
    </style>

    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
</head>

<body>

    <div class="container">
        <h1>JSON Veri Düzenleyici</h1>
        <div id="editor-container"></div>
        <div class="save-btn-container">
            <button class="save-btn" onclick="saveChanges()">Değişiklikleri Kaydet</button>
        </div>
    </div>

    <script>
        let jsonData = [];

        // JSON dosyasından verileri yükle
        fetch('../projects.json')
            .then(response => response.json())
            .then(data => {
                jsonData = data;
                createForm();
            })
            .catch(error => {
                console.error('JSON verisi yüklenirken hata oluştu:', error);
            });

        const editorContainer = document.getElementById('editor-container');
        const allTags = new Set(); // Tüm etiketleri depolamak için bir Set

        function createForm() {
            editorContainer.innerHTML = ''; // Eski içeriği temizle

            // Tüm projelerdeki etiketleri topla
            jsonData.forEach(project => {
                if (project.tags) {
                    project.tags.forEach(tag => allTags.add(tag));
                }
            });

            // Datalist öğesini oluştur ve editöre ekle
            const tagsDatalist = document.createElement('datalist');
            tagsDatalist.id = 'tag-suggestions';
            allTags.forEach(tag => {
                const option = document.createElement('option');
                option.value = tag;
                tagsDatalist.appendChild(option);
            });
            editorContainer.appendChild(tagsDatalist);

            jsonData.forEach((project, index) => {
                const accordionItem = document.createElement('div');
                accordionItem.className = 'accordion-item';

                const accordionHeader = document.createElement('div');
                accordionHeader.className = 'accordion-header';
                accordionHeader.innerHTML = `
                <span>${project.title}</span>
                <span class="arrow">&#9654;</span>
            `;
                accordionHeader.onclick = () => {
                    accordionItem.classList.toggle('active');
                };
                accordionItem.appendChild(accordionHeader);

                const accordionContent = document.createElement('div');
                accordionContent.className = 'accordion-content';

                // Tüm anahtar-değer çiftleri için form grupları oluştur
                for (const key in project) {
                    if (key === 'media' || key === 'tags') {
                        const formGroup = document.createElement('div');
                        formGroup.className = 'form-group';
                        formGroup.innerHTML = `<label>${key.charAt(0).toUpperCase() + key.slice(1)}:</label>`;

                        const listContainer = document.createElement('div');
                        listContainer.className = `${key}-list`;

                        project[key].forEach((item) => {
                            const itemSpan = document.createElement('span');
                            itemSpan.textContent = item;
                            itemSpan.innerHTML += ` <span class="remove-btn" onclick="removeItem(this)">x</span>`;
                            listContainer.appendChild(itemSpan);
                        });

                        const newItemInput = document.createElement('input');
                        newItemInput.type = 'text';
                        newItemInput.placeholder = `Yeni ${key === 'media' ? 'dosya yolu' : 'etiket'} ekle`;
                        newItemInput.classList.add('small-input');
                        if (key === 'tags') {
                            newItemInput.setAttribute('list', 'tag-suggestions');
                        }

                        const addBtn = document.createElement('button');
                        addBtn.textContent = 'Ekle';
                        addBtn.className = 'add-btn';
                        addBtn.onclick = () => addItem(newItemInput.value, listContainer, key);

                        formGroup.appendChild(listContainer);
                        formGroup.appendChild(newItemInput);
                        formGroup.appendChild(addBtn);

                        accordionContent.appendChild(formGroup);

                    } else if (key === 'enabled') {
                        const formGroup = document.createElement('div');
                        formGroup.className = 'form-group';
                        formGroup.innerHTML = `
                        <label>
                            <input type="checkbox" data-key="${key}" ${project[key] ? 'checked' : ''}>
                            ${key.charAt(0).toUpperCase() + key.slice(1)}
                        </label>
                    `;
                        accordionContent.appendChild(formGroup);
                    } else {
                        const formGroup = document.createElement('div');
                        formGroup.className = 'form-group';

                        const isDescription = key === 'description';
                        const inputElement = isDescription ? 'textarea' : 'input';
                        const inputType = isDescription ? '' : 'type="text"';
                        const value = project[key] !== null ? project[key] : '';
                        const placeholderText = isDescription ? 'Proje hakkında detaylı bir açıklama girin...' : '';

                        formGroup.innerHTML = `
        <label for="${key}-${index}">${key.charAt(0).toUpperCase() + key.slice(1)}:</label>
        <${inputElement} id="${key}-${index}" data-key="${key}" ${inputType} rows="${isDescription ? 4 : 1}" placeholder="${placeholderText}">${value}</${inputElement}>
    `;
                        accordionContent.appendChild(formGroup);

                        // Eğer description alanıysa EasyMDE'yi başlat
                        if (isDescription) {
                            const textareaId = `${key}-${index}`;
                            setTimeout(() => {
                                const easyMDE = new EasyMDE({
                                    element: document.getElementById(textareaId),
                                    initialValue: value,
                                    spellChecker: false,
                                    forceSync: true, // Form submit edildiğinde textarea'yı günceller
                                    status: false,
                                    toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview", "side-by-side", "fullscreen"]
                                });
                                // EasyMDE nesnesini daha sonra erişmek için bir yere kaydet
                                project.easyMDEInstance = easyMDE;
                            }, 0); // DOM'un güncellenmesini bekler
                        }
                    }
                }
                accordionItem.appendChild(accordionContent);
                editorContainer.appendChild(accordionItem);
            });
        }

        // removeItem() fonksiyonunu güncelleyin
        function removeItem(element) {
            const span = element.parentElement;
            span.remove();
        }

        // addItem() fonksiyonunu güncelleyin
        function addItem(value, listContainer, key) {
            if (value.trim() === '') return;

            const itemSpan = document.createElement('span');
            itemSpan.textContent = value;
            itemSpan.innerHTML += ` <span class="remove-btn" onclick="removeItem(this)">x</span>`;
            listContainer.appendChild(itemSpan);

            // Yeni eklenen etiketi, datalist'e de ekle
            if (key === 'tags') {
                if (!allTags.has(value)) {
                    allTags.add(value);
                    const tagsDatalist = document.getElementById('tag-suggestions');
                    const option = document.createElement('option');
                    option.value = value;
                    tagsDatalist.appendChild(option);
                }
            }

            const newItemInput = listContainer.nextElementSibling;
            newItemInput.value = '';
        }
        function saveChanges() {
            const updatedData = [];
            const accordionItems = document.querySelectorAll('.accordion-item');

            accordionItems.forEach((item, index) => {
                const originalProject = jsonData[index];
                const updatedProject = {
                    ...originalProject
                };

                const content = item.querySelector('.accordion-content');

                const descriptionTextarea = content.querySelector('textarea[data-key="description"]');
                if (descriptionTextarea) {
                    const easyMDEInstance = jsonData[index].easyMDEInstance;
                    if (easyMDEInstance) {
                        updatedProject.description = easyMDEInstance.value();
                    } else {
                        updatedProject.description = descriptionTextarea.value;
                    }
                }

                const textInputs = content.querySelectorAll('input[type="text"]');
                textInputs.forEach(input => {
                    const key = input.dataset.key;
                    if (key) {
                        if (input.value.trim() !== '') {
                            updatedProject[key] = input.value.trim();
                        }
                    }
                });

                const checkbox = content.querySelector('input[type="checkbox"]');
                if (checkbox) {
                    const key = checkbox.dataset.key;
                    updatedProject[key] = checkbox.checked;
                }

                // --- Düzeltilen Kısım: Boş elemanları filtrele ---

                // Media listesini al ve boş stringleri filtrele
                const mediaItems = content.querySelectorAll('.media-list span');
                updatedProject.media = Array.from(mediaItems)
                    .map(span => span.textContent.trim().replace(/\s*x$/, ''))
                    .filter(item => item !== ''); // Boş stringleri kaldır

                // Etiket (tags) listesini al ve boş stringleri filtrele
                const tagsItems = content.querySelectorAll('.tags-list span');
                updatedProject.tags = Array.from(tagsItems)
                    .map(span => span.textContent.trim().replace(/\s*x$/, ''))
                    .filter(item => item !== ''); // Boş stringleri kaldır

                // --- Düzeltilen Kısım Bitişi ---

                delete updatedProject.easyMDEInstance;

                updatedData.push(updatedProject);
            });

            const jsonString = JSON.stringify(updatedData, null, 2);
            const blob = new Blob([jsonString], {
                type: 'application/json'
            });
            const url = URL.createObjectURL(blob);

            const a = document.createElement('a');
            a.href = url;
            a.download = 'projects.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            alert('Değişiklikler projects.json dosyası olarak indirildi!');
        }
        
        document.addEventListener('DOMContentLoaded', createForm);
    </script>

</body>

</html>
